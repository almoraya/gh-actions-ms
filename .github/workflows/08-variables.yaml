name: 08 - Using Variables

on: 
  - push
  - workflow_dispatch

env:
  WORKFLOW_VAR: "I am a workflow environment variable"
  OVERWRITTEN_VAR: "I will be overwritten"

jobs:
  echo:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "I am a job environment variable"
      OVERWRITTEN_VAR: "I have been overwritten by the job environment variable"
    steps:
      - name: Print Environment Variables
        env:
          STEP_VAR: "I am a step environment variable"
          STEP_VAR2: "I am another step environment variable"
        run: |
          echo "Step env var: ${{ env.STEP_VAR }}"
          echo "Step env var 2: ${{ env.STEP_VAR2 }}"
          echo "Job env var: ${{ env.JOB_VAR }}"
          echo "Workflow env var: ${{ env.WORKFLOW_VAR }}"
          echo "Overwritten env var: ${{ env.OVERWRITTEN_VAR }}"

      - name: Overwrite Job Environment Variable
        env:
          OVERWRITTEN_VAR: "I have been overwritten at the step level"
        run: |
          echo "Step env var: ${{ env.OVERWRITTEN_VAR }}"