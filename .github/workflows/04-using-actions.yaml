name: 04 - Using Actions
on:
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    #defaults:
    #  run:
    #    working-directory: 04-using-actions/react-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Printing Folders
        run: |
          echo "Current directory: $(pwd)"
          echo "React app contents:"
          ls -la 04-using-actions/react-app
          echo "Workflows contents:"
          ls -la .github/workflows/ || echo "Workflows folder not found"
      
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Dependencies
        working-directory: 04-using-actions/react-app
        run: npm ci

      - name: Run Unit Tests
        working-directory: 04-using-actions/react-app
        run: npm run test